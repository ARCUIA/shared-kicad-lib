name: Regenerate library tables

on:
  push:
    branches: [main]
    paths:
      - 'symbols/**'
      - 'footprints/**'
      - 'scripts/generate-lib-tables.sh'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run generator
        run: bash scripts/generate-lib-tables.sh

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sym-lib-table fp-lib-table
          if ! git diff --cached --quiet; then
            git commit -m "Auto-regenerate library tables"
            git push
          else
            echo "No changes to library tables."
          fi
